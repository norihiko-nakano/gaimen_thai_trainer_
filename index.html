<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3ede3">
<title>Gaimen Thai Trainer Ver4.0</title>
<script type="text/javascript" src="https://gc.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=_GEuWmyDo2MnqKgVZECdGcHdJbWMR4kJnF3gsu5-JDGQd30XyDjT0kGh_q6fbGmX9APIKSs9fkeiNDvzFCUB7y_-KdqfjLMCRwEjfvROg1zRJnvREoUzoYKCHi6KVwO1tguf3U8OxhON7QeeqMsq6JUuk_tjCOCeAySqA5_8tXo2knKxNmqhADXE9gfzaFOjngIs6i44k1X23nUkJarjYXIwo2FdvShZhpiNx8KKkcCGVq5PWU7HiKxeTSduJbaHwfR4jfbQqty3jI2mO7FcUQ" charset="UTF-8"></script><style>
:root{--bg:#f3ede3;--card:#fffdf8;--ink:#2c2925;--muted:#756f66;--line:#ddd3c5;--accent:#a86a37;--green:#436b45;--ok:#287a49;--bad:#a33b35}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}
.wrap{max-width:760px;margin:auto;padding:16px 16px 40px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0}
h1{font-size:1.4rem;margin:6px 0}.sub,.small{color:var(--muted);line-height:1.55}.small{font-size:.86rem}
button{width:100%;font:inherit;font-weight:800;border:0;border-radius:15px;padding:14px;margin:5px 0;cursor:pointer}
.exam{background:var(--accent);color:#fff}.reviewBtn{background:var(--green);color:#fff;font-size:1.05rem}.ghost{background:#eee6dc;color:var(--ink)}
.grid,.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answers{margin-top:14px}
.true{background:#e2f1e7;color:#1f693f;border:2px solid #b8dac3}.false{background:#f7e3e1;color:#8a302c;border:2px solid #e6b9b5}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin:10px 0}
.bar{height:10px;background:#e8dfd3;border-radius:999px;overflow:hidden}.barin{height:100%;background:var(--accent);width:0}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee6dc;font-size:.8rem}.rank{background:#e7f0e7;color:#315b34}
.q{font-size:1.15rem;line-height:1.75;font-weight:800;min-height:170px;display:flex;align-items:center}
.hidden{display:none!important}.feedback{margin-top:14px;padding:14px;border-radius:14px;line-height:1.7}.ok{background:#e6f2e9;color:#20613a}.bad{background:#f7e4e2;color:#842f2a}
.score{font-size:3rem;font-weight:900;text-align:center}.center{text-align:center}.pass{color:var(--ok)}.fail{color:var(--bad)}
.reviewCard{background:#fff1ef;border:1px solid #e6c3bf;border-radius:16px;padding:15px;margin:12px 0;line-height:1.65}
.why{background:white;border-radius:12px;padding:12px;margin-top:10px}.status{padding:10px 12px;border-radius:12px;margin-top:10px;background:#fff6db;color:#8d641e}
label{display:block;font-size:.88rem;font-weight:700;margin-top:10px}input{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:12px}
details{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}summary{font-weight:800;cursor:pointer}
@media(max-width:520px){.grid,.answers{grid-template-columns:1fr}.q{font-size:1.08rem;min-height:190px}}
</style>
</head>
<body><div class="wrap">
<h1>🚗 แบบฝึกหัดใบขับขี่ญี่ปุ่น 🇯🇵</h1>
<div class="sub">Ver4.0 • 50 ข้อสุ่ม + ทบทวนข้อที่ผิดบ่อยที่สุด 🐘</div>

<section id="home">
<div class="card">
<button class="exam" onclick="startExam()">📝 สุ่ม 50 ข้อ</button>
<button class="reviewBtn" onclick="startReview()">ทบทวนข้อที่ผิด(｀･∀･´)🐘</button>
<p class="small">โหมดทบทวนจะเรียงจากข้อที่ “เคยผิดมากที่สุด” และออกทีละ 1 ข้อ หลังตอบแต่ละข้อจะเห็นคำตอบและเหตุผลภาษาไทยทันที</p>
<div class="grid"><button class="ghost" onclick="showWrongList()">📕 รายการข้อผิด</button><button class="ghost" onclick="showHistory()">📊 ประวัติ</button></div>
<div id="dbStatus" class="status"></div>
<details>
<summary>⚙️ Supabase</summary>
<label>Participant / รหัสผู้ใช้</label><input id="participant">
<label>Project URL</label><input id="sbUrl">
<label>Publishable / anon key</label><input id="sbKey">
<button class="ghost" onclick="saveSettings()">บันทึกการตั้งค่า</button>
</details>
</div>
</section>

<section id="quiz" class="hidden">
<div class="card">
<div class="top"><button style="width:auto" class="ghost" onclick="goHome()">←</button><span id="modeLabel" class="small"></span></div>
<div class="meta"><span id="poolLabel"></span><span id="counter"></span></div><div class="bar"><div id="bar" class="barin"></div></div>
</div>
<div class="card">
<span id="badge" class="badge"></span> <span id="rank" class="badge rank hidden"></span>
<div id="question" class="q"></div>
<div class="answers"><button id="bTrue" class="true" onclick="answer(true)">○ ถูก</button><button id="bFalse" class="false" onclick="answer(false)">× ผิด</button></div>
<div id="feedback" class="feedback hidden"></div>
<button id="nextBtn" class="reviewBtn hidden" onclick="nextReview()">ข้อต่อไป →</button>
</div>
</section>

<section id="result" class="hidden">
<div class="card center"><div id="resultTitle"></div><div id="score" class="score"></div><div id="judge"></div><div id="syncMsg" class="status"></div></div>
<div id="wrongReview" class="card"><h2>📕 ข้อที่ตอบผิด</h2><div id="wrongReviewList"></div></div>
<div class="card"><button class="exam" onclick="startExam()">🎲 สุ่ม 50 ข้อใหม่</button><button class="reviewBtn" onclick="startReview()">ทบทวนข้อที่ผิด(｀･∀･´)🐘</button><button class="ghost" onclick="goHome()">กลับหน้าหลัก</button></div>
</section>

<section id="list" class="hidden"><div class="card"><button class="ghost" onclick="goHome()">← กลับ</button><h2>📕 ข้อที่เคยตอบผิด</h2><div id="wrongList"></div></div></section>
<section id="history" class="hidden"><div class="card"><button class="ghost" onclick="goHome()">← กลับ</button><h2>📊 ประวัติ</h2><div id="historyList"></div></div></section>

</div>
<script>
const Q=[{"id": "6-1", "set": 6, "no": 1, "th": "เมื่อเข้าใกล้เส้นหยุดก่อนทางแยกแล้วไฟเปลี่ยนเป็นสีเหลือง ถ้าหยุดอย่างปลอดภัยไม่ได้ สามารถขับผ่านทางแยกต่อไปได้", "ans": true, "source": "ชุด 6 ข้อ 1", "exp": "เมื่อมีกฎให้หยุด ต้องหยุดก่อนเส้นหยุด ไม่ควรล้ำเส้นเพราะอาจกีดขวางคนเดินเท้าหรือรถในทางแยก"}, {"id": "6-2", "set": 6, "no": 2, "th": "รถบรรทุกขนาดใหญ่และรถจักรยานยนต์ทั่วไปสามารถวิ่งในช่องทางพิเศษสำหรับรถประจำทางได้เสมอเมื่อการจราจรไม่ติดขัด", "ans": false, "source": "ชุด 6 ข้อ 2", "exp": "ข้อนี้ผิด ข้อความในโจทย์มีเงื่อนไขหรือหลักการที่ไม่ถูกต้องตามเฉลยของหนังสือ ให้จำคำตอบที่ถูกและตรวจหัวข้อนี้อีกครั้งจากต้นฉบับ โดยเฉพาะคำที่ทำให้ความหมายเด็ดขาด เช่น 'เสมอ', 'ไม่จำเป็น', หรือ 'สามารถทำได้'"}, {"id": "6-3", "set": 6, "no": 3, "th": "ป้ายนี้หมายความว่า รถยนต์ต้องหยุด", "ans": false, "source": "ชุด 6 ข้อ 3", "exp": "ข้อนี้ผิด ข้อความในโจทย์มีเงื่อนไขหรือหลักการที่ไม่ถูกต้องตามเฉลยของหนังสือ ให้จำคำตอบที่ถูกและตรวจหัวข้อนี้อีกครั้งจากต้นฉบับ โดยเฉพาะคำที่ทำให้ความหมายเด็ดขาด เช่น 'เสมอ', 'ไม่จำเป็น', หรือ 'สามารถทำได้'"}, {"id": "6-4", "set": 6, "no": 4, "th": "บริเวณทางโค้งหรือยอดเนินต้องขับช้า", "ans": true, "source": "ชุด 6 ข้อ 4", "exp": "ข้อนี้ถูกต้อง เพราะเป็นวิธีปฏิบัติที่สอดคล้องกับกฎและหลักความปลอดภัยของญี่ปุ่น จุดที่ต้องจำคือ: บริเวณทางโค้งหรือยอดเนินต้องขับช้า"}, {"id": "6-5", "set": 6, "no": 5, "th": "สัญญาณถอยหลังควรเริ่มประมาณ 3 วินาทีก่อนเริ่มถอย", "ans": true, "source": "ชุด 6 ข้อ 5", "exp": "การเปลี่ยนช่องทางต้องให้สัญญาณล่วงหน้าประมาณ 3 วินาที เพื่อให้รถรอบข้างรู้เจตนาก่อนรถเริ่มเคลื่อนด้านข้าง"}, {"id": "6-6", "set": 6, "no": 6, "th": "ถ้าลากรถที่มีน้ำหนักรวมเกิน 750 กก. ด้วยรถยนต์ทั่วไป ต้องมีใบอนุญาตสำหรับการลากจูงเพิ่มเติมจากใบขับขี่", "ans": true, "source": "ชุด 6 ข้อ 6", "exp": "ข้อนี้ถูกต้อง เพราะเป็นวิธีปฏิบัติที่สอดคล้องกับกฎและหลักความปลอดภัยของญี่ปุ่น จุดที่ต้องจำคือ: ถ้าลากรถที่มีน้ำหนักรวมเกิน 750 กก. ด้วยรถยนต์ทั่วไป ต้องมีใบอนุญาตสำหรับการลากจูงเพิ่มเติมจากใบขับขี่"}, {"id": "6-7", "set": 6, "no": 7, "th": "ท่าขี่รถจักรยานยนต์ที่ถูกต้องคือเหยียดหลังตรงและจ้องมองจุดเดียวข้างหน้า", "ans": false, "source": "ชุด 6 ข้อ 7", "exp": "ข้อนี้ผิด ข้อความในโจทย์มีเงื่อนไขหรือหลักการที่ไม่ถูกต้องตามเฉลยของหนังสือ ให้จำคำตอบที่ถูกและตรวจหัวข้อนี้อีกครั้งจากต้นฉบับ โดยเฉพาะคำที่ทำให้ความหมายเด็ดขาด เช่น 'เสมอ', 'ไม่จำเป็น', หรือ 'สามารถทำได้'"}, {"id": "6-8", "set": 6, "no": 8, "th": "ถ้ายางแตกขณะขับ ให้จับพวงมาลัยให้มั่น ลดคันเร่ง และค่อย ๆ เบรกเป็นช่วง ๆ จนหยุด", "ans": true, "source": "ชุด 6 ข้อ 8", "exp": "ถ้ายางแตก ให้จับพวงมาลัยให้มั่น ลดคันเร่ง และค่อย ๆ ลดความเร็ว หลีกเลี่ยงการเบรกหรือหักพวงมาลัยอย่างกะทันหัน"}, {"id": "6-9", "set": 6, "no": 9, "th": "ถ้าไม่มีป้ายห้ามจอด สามารถจอดรถต่อเนื่องในที่เดิมตอนกลางคืนเกิน 8 ชั่วโมงได้", "ans": false, "source": "ชุด 6 ข้อ 9", "exp": "ข้อนี้ผิด ข้อความในโจทย์มีเงื่อนไขหรือหลักการที่ไม่ถูกต้องตามเฉลยของหนังสือ ให้จำคำตอบที่ถูกและตรวจหัวข้อนี้อีกครั้งจากต้นฉบับ โดยเฉพาะคำที่ทำให้ความหมายเด็ดขาด เช่น 'เสมอ', 'ไม่จำเป็น', หรือ 'สามารถทำได้'"}, {"id": "6-10", "set": 6, "no": 10, "th": "ถ้าผู้บาดเจ็บจากอุบัติเหตุมีอาการกระดูกหัก และไม่มีความเสี่ยงจากรถคันหลัง ไม่ควรขยับผู้บาดเจ็บโดยไม่จำเป็น", "ans": true, "source": "ชุด 6 ข้อ 10", "exp": "ข้อนี้ถูกต้อง เพราะเป็นวิธีปฏิบัติที่สอดคล้องกับกฎและหลักความปลอดภัยของญี่ปุ่น จุดที่ต้องจำคือ: ถ้าผู้บาดเจ็บจากอุบัติเหตุมีอาการกระดูกหัก และไม่มีความเสี่ยงจากรถคันหลัง ไม่ควรขยับผู้บาดเจ็บโดยไม่จำเป็น"}, {"id": "6-11", "set": 6, "no": 11, "th": "ทางด่วนออกแบบมาให้ขับง่าย จึงไม่มีอันตรายแม้ผู้ขับยังไม่ชำนาญ", "ans": false, "source": "ชุด 6 ข้อ 11", "exp": "ข้อนี้ผิด ข้อความในโจทย์มีเงื่อนไขหรือหลักการที่ไม่ถูกต้องตามเฉลยของหนังสือ ให้จำคำตอบที่ถูกและตรวจหัวข้อนี้อีกครั้งจากต้นฉบับ โดยเฉพาะคำที่ทำให้ความหมายเด็ดขาด เช่น 'เสมอ', 'ไม่จำเป็น', หรือ 'สามารถทำได้'"}, {"id": "6-12", "set": 6, "no": 12, "th": "ผู้โดยสารเบาะหลังไม่จำเป็นต้องคาดเข็มขัดนิรภัย", "ans": false, "source": "ชุด 6 ข้อ 12", "exp": "ผู้โดยสารเบาะหลังต้องคาดเข็มขัดนิรภัยด้วย ไม่ได้บังคับเฉพาะคนขับและผู้โดยสารด้านหน้า"}, {"id": "6-13", "set": 6, "no": 13, "th": "ป้ายนี้หมายความว่ารถยนต์ทุกชนิดรวมถึงรถจักรยานยนต์ทั่วไปผ่านไม่ได้", "ans": false, "source": "ชุด 6 ข้อ 13", "exp": "ข้อนี้ผิด ข้อความในโจทย์มีเงื่อนไขหรือหลักการที่ไม่ถูกต้องตามเฉลยของหนังสือ ให้จำคำตอบที่ถูกและตรวจหัวข้อนี้อีกครั้งจากต้นฉบับ โดยเฉพาะคำที่ทำให้ความหมายเด็ดขาด เช่น 'เสมอ', 'ไม่จำเป็น', หรือ 'สามารถทำได้'"}, {"id": "6-14", "set": 6, "no": 14, "th": "ถนนกว้างไม่พอให้รถผ่านด้านซ้ายเพราะมีงานก่อสร้าง จึงสามารถล้ำไปด้านขวาของกึ่งกลางถนนเพื่อผ่านได้เสมอ", "ans": false, "source": "ชุด 6 ข้อ 14", "exp": "ข้อนี้ผิด ข้อความในโจทย์มีเงื่อนไขหรือหลักการที่ไม่ถูกต้องตามเฉลยของหนังสือ ให้จำคำตอบที่ถูกและตรวจหัวข้อนี้อีกครั้งจากต้นฉบับ โดยเฉพาะคำที่ทำให้ความหมายเด็ดขาด เช่น 'เสมอ', 'ไม่จำเป็น', หรือ 'สามารถทำได้'"}, {"id": "6-15", "set": 6, "no": 15, "th": "เมื่อขับผ่านทางรถไฟ ควรขับใกล้กึ่งกลางเพื่อไม่ให้ล้อหลุดร่อง", "ans": true, "source": "ชุด 6 ข้อ 15", "exp": "ข้อนี้ถูกต้อง เพราะเป็นวิธีปฏิบัติที่สอดคล้องกับกฎและหลักความปลอดภัยของญี่ปุ่น จุดที่ต้องจำคือ: เมื่อขับผ่านทางรถไฟ ควรขับใกล้กึ่งกลางเพื่อไม่ให้ล้อหลุดร่อง"}, {"id": "6-16", "set": 6, "no": 16, "th": "ใกล้โรงเรียน อนุบาล หรือสนามเด็กเล่น มีการห้ามแซงเพราะเด็กอาจวิ่งออกมา", "ans": false, "source": "ชุด 6 ข้อ 16", "exp": "ข้อนี้ผิด ข้อความในโจทย์มีเงื่อนไขหรือหลักการที่ไม่ถูกต้องตามเฉลยของหนังสือ ให้จำคำตอบที่ถูกและตรวจหัวข้อนี้อีกครั้งจากต้นฉบับ โดยเฉพาะคำที่ทำให้ความหมายเด็ดขาด เช่น 'เสมอ', 'ไม่จำเป็น', หรือ 'สามารถทำได้'"}, {"id": "6-17", "set": 6, "no": 17, "th": "ถ้าจะแซงโดยล้ำออกด้านขวา แม้รถสวนทางดูไกลก็อาจเข้ามาเร็วกว่าที่คิด จึงควรรอให้ผ่านก่อนแล้วจึงแซงเมื่อปลอดภัย", "ans": true, "source": "ชุด 6 ข้อ 17", "exp": "ข้อนี้ถูกต้อง เพราะเป็นวิธีปฏิบัติที่สอดคล้องกับกฎและหลักความปลอดภัยของญี่ปุ่น จุดที่ต้องจำคือ: ถ้าจะแซงโดยล้ำออกด้านขวา แม้รถสวนทางดูไกลก็อาจเข้ามาเร็วกว่าที่คิด จึงควรรอให้ผ่านก่อนแล้วจึงแซงเมื่อปลอดภัย"}, {"id": "6-18", "set": 6, "no": 18, "th": "แรงเสียดทานระหว่างยางกับถนนไม่เปลี่ยนตามสภาพถนน จึงหยุดได้ในระยะเท่าเดิมเสมอ", "ans": false, "source": "ชุด 6 ข้อ 18", "exp": "ข้อนี้ผิด ข้อความในโจทย์มีเงื่อนไขหรือหลักการที่ไม่ถูกต้องตามเฉลยของหนังสือ ให้จำคำตอบที่ถูกและตรวจหัวข้อนี้อีกครั้งจากต้นฉบับ โดยเฉพาะคำที่ทำให้ความหมายเด็ดขาด เช่น 'เสมอ', 'ไม่จำเป็น', หรือ 'สามารถทำได้'"}, {"id": "6-19", "set": 6, "no": 19, "th": "ตอนกลางคืน หากเปลี่ยนไฟหน้าเป็นไฟต่ำตลอดเวลาจะทำให้มองเห็นแย่ลง จึงควรใช้ไฟสูงแม้มีรถสวนทาง", "ans": true, "source": "ชุด 6 ข้อ 19", "exp": "เมื่อมีรถสวนหรือรถอยู่ข้างหน้า ต้องใช้ไฟให้เหมาะสมและลดแสงที่รบกวนสายตาผู้อื่น ไม่ควรใช้ไฟสูงตลอดเวลา"}, {"id": "6-20", "set": 6, "no": 20, "th": "สายพานพัดลมควรตึงมากที่สุด ยิ่งกดตรงกลางแล้วหย่อนน้อยยิ่งดี", "ans": true, "source": "ชุด 6 ข้อ 20", "exp": "ข้อนี้ถูกต้อง เพราะเป็นวิธีปฏิบัติที่สอดคล้องกับกฎและหลักความปลอดภัยของญี่ปุ่น จุดที่ต้องจำคือ: สายพานพัดลมควรตึงมากที่สุด ยิ่งกดตรงกลางแล้วหย่อนน้อยยิ่งดี"}, {"id": "6-21", "set": 6, "no": 21, "th": "เมื่อลงจากรถ เกียร์ธรรมดาควรใส่ถอยหลังบนทางราบหรือทางลง และเกียร์อัตโนมัติควรใส่ P", "ans": true, "source": "ชุด 6 ข้อ 21", "exp": "ข้อนี้ถูกต้อง เพราะเป็นวิธีปฏิบัติที่สอดคล้องกับกฎและหลักความปลอดภัยของญี่ปุ่น จุดที่ต้องจำคือ: เมื่อลงจากรถ เกียร์ธรรมดาควรใส่ถอยหลังบนทางราบหรือทางลง และเกียร์อัตโนมัติควรใส่ P"}, {"id": "6-22", "set": 6, "no": 22, "th": "บนทางด่วนที่ไม่มีการกำหนดความเร็ว รถบรรทุกขนาดใหญ่มีความเร็วสูงสุด 90 กม./ชม.", "ans": true, "source": "ชุด 6 ข้อ 22", "exp": "ข้อนี้ถูกต้อง เพราะเป็นวิธีปฏิบัติที่สอดคล้องกับกฎและหลักความปลอดภัยของญี่ปุ่น จุดที่ต้องจำคือ: บนทางด่วนที่ไม่มีการกำหนดความเร็ว รถบรรทุกขนาดใหญ่มีความเร็วสูงสุด 90 กม./ชม."}, {"id": "6-23", "set": 6, "no": 23, "th": "ถ้าผลักรถจักรยานยนต์โดยดับเครื่องและเดินจูง จะถือเป็นคนเดินเท้า", "ans": false, "source": "ชุด 6 ข้อ 23", "exp": "ข้อนี้ผิด ข้อความในโจทย์มีเงื่อนไขหรือหลักการที่ไม่ถูกต้องตามเฉลยของหนังสือ ให้จำคำตอบที่ถูกและตรวจหัวข้อนี้อีกครั้งจากต้นฉบับ โดยเฉพาะคำที่ทำให้ความหมายเด็ดขาด เช่น 'เสมอ', 'ไม่จำเป็น', หรือ 'สามารถทำได้'"}, {"id": "6-24", "set": 6, "no": 24, "th": "ป้ายวงกลม 30 หมายถึงความเร็วสูงสุด 30 กม./ชม.", "ans": true, "source": "ชุด 6 ข้อ 24", "exp": "ข้อ const VER="4.0";
const LS={url:"gtt_sb_url_v31",key:"gtt_sb_key_v31",part:"gtt_participant_v31",queue:"gtt_sync_queue_v31",hist:"gtt_hist_v31",oldWrong:"gtt_wrong_v31",counts:"gtt_wrong_counts_v40"};
let session=[],idx=0,correct=0,mode="exam",answers=[],examId="",examStart=0,qStart=0,locked=false;
const $=id=>document.getElementById(id);
function only(id){["home","quiz","result","list","history"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function uuid(){return crypto&&crypto.randomUUID?crypto.randomUUID():Date.now()+"_"+Math.random()}
function cfg(){return {url:(localStorage.getItem(LS.url)||"").replace(/\/$/,""),key:localStorage.getItem(LS.key)||"",part:localStorage.getItem(LS.part)||"player1"}}
function hasDb(){let c=cfg();return c.url.startsWith("https://")&&c.key.length>20}
function hdr(){let c=cfg(),h={apikey:c.key,"Content-Type":"application/json",Prefer:"return=minimal"};if(c.key.startsWith("eyJ"))h.Authorization="Bearer "+c.key;return h}
function loadSettings(){let c=cfg();$("participant").value=c.part;$("sbUrl").value=c.url;$("sbKey").value=c.key;$("dbStatus").textContent=hasDb()?"☁️ Supabase: connected settings":"📱 Supabase 未設定: iPhone履歴で復習"}
function saveSettings(){localStorage.setItem(LS.part,$("participant").value.trim()||"player1");localStorage.setItem(LS.url,$("sbUrl").value.trim().replace(/\/$/,""));localStorage.setItem(LS.key,$("sbKey").value.trim());loadSettings();flush()}
async function post(table,row){let c=cfg(),r=await fetch(`${c.url}/rest/v1/${table}`,{method:"POST",headers:hdr(),body:JSON.stringify([row])});if(!r.ok)throw new Error(await r.text())}
async function rpc(name,body){let c=cfg(),h=hdr();h.Prefer="return=representation";let r=await fetch(`${c.url}/rest/v1/rpc/${name}`,{method:"POST",headers:h,body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json()}
function queue(){try{return JSON.parse(localStorage.getItem(LS.queue)||"[]")}catch(e){return []}}
function setQueue(q){localStorage.setItem(LS.queue,JSON.stringify(q.slice(-500)))}
async function send(table,row){if(!hasDb()){let q=queue();q.push({table,row});setQueue(q);return false}try{await post(table,row);return true}catch(e){let q=queue();q.push({table,row});setQueue(q);return false}}
async function flush(){if(!hasDb())return;let q=queue(),left=[];for(let x of q){try{await post(x.table,x.row)}catch(e){left.push(x)}}setQueue(left)}
function localCounts(){let c={};try{c=JSON.parse(localStorage.getItem(LS.counts)||"{}")}catch(e){};try{for(let id of JSON.parse(localStorage.getItem(LS.oldWrong)||"[]"))if(!c[id])c[id]={count:1,last:null}}catch(e){}return c}
function incWrong(id){let c=localCounts();if(!c[id])c[id]={count:0,last:null};c[id].count++;c[id].last=new Date().toISOString();localStorage.setItem(LS.counts,JSON.stringify(c))}
async function reviewStats(){
 if(hasDb()){try{let r=await rpc("get_driving_review_stats",{p_participant:cfg().part});if(r&&r.length)return r.map(x=>({id:x.question_id,count:+x.wrong_count||0,last:x.last_wrong_at,src:"DB"}))}catch(e){}}
 return Object.entries(localCounts()).map(([id,v])=>({id,count:+v.count||1,last:v.last,src:"iPhone"})).sort((a,b)=>b.count-a.count)
}
function startExam(){mode="exam";session=sh(Q).slice(0,50).map(q=>({...q,wrong_count:0,src:""}));examId=uuid();examStart=Date.now();begin()}
async function startReview(){let stats=await reviewStats(),map=Object.fromEntries(Q.map(q=>[q.id,q]));stats=stats.filter(s=>map[s.id]).sort((a,b)=>b.count-a.count||String(b.last||"").localeCompare(String(a.last||"")));if(!stats.length){alert("ยังไม่มีข้อผิดสำหรับทบทวน");return}mode="review";session=stats.map(s=>({...map[s.id],wrong_count:s.count,src:s.src}));examId=uuid();examStart=Date.now();begin()}
function begin(){idx=0;correct=0;answers=[];only("quiz");render();flush()}
function render(){locked=false;let q=session[idx];$("badge").textContent=`ชุด ${q.set} • ข้อ ${q.no}`;$("question").textContent=q.th;$("counter").textContent=`${idx+1}/${session.length}`;$("bar").style.width=`${idx/session.length*100}%`;$("modeLabel").textContent=mode==="exam"?"📝 50 ข้อสุ่ม":"🐘 ทบทวน";$("poolLabel").textContent=mode==="exam"?"180 ข้อ":"ผิดบ่อย → ผิดน้อย";$("feedback").className="feedback hidden";$("nextBtn").classList.add("hidden");$("bTrue").disabled=false;$("bFalse").disabled=false;if(mode==="review"){$("rank").classList.remove("hidden");$("rank").textContent=`ผิด ${q.wrong_count} ครั้ง • ${q.src}`}else $("rank").classList.add("hidden");qStart=Date.now()}
async function answer(v){if(locked)return;locked=true;let q=session[idx],ms=Date.now()-qStart,ok=v===q.ans;if(ok)correct++;else incWrong(q.id);answers.push({id:q.id,given:v,ok,ms});send("driving_attempts",{exam_id:examId,participant:cfg().part,mode,question_id:q.id,set_no:q.set,question_no:q.no,user_answer:v,correct_answer:q.ans,is_correct:ok,response_ms:ms,answered_at:new Date().toISOString(),app_version:VER});
 if(mode==="review"){let n=q.wrong_count+(ok?0:1),f=$("feedback");f.className="feedback "+(ok?"ok":"bad");f.innerHTML=`<b>${ok?"✅ ถูกต้อง":"❌ ผิด"}</b><br>คำตอบที่ถูก: <b>${q.ans?"○ ถูก":"× ผิด"}</b><br>⏱ ${(ms/1000).toFixed(1)} วินาที<br>📊 เคยผิด: <b>${n} ครั้ง</b><div class="why"><b>💡 เหตุผล</b><br>${q.exp}</div>`;$("bTrue").disabled=true;$("bFalse").disabled=true;$("nextBtn").classList.remove("hidden");return}
 idx++;if(idx>=session.length)finishExam();else render()}
function nextReview(){idx++;if(idx>=session.length)finishReview();else render()}
async function saveSession(){let end=Date.now();return send("driving_exam_sessions",{exam_id:examId,participant:cfg().part,mode,score:correct,total:session.length,duration_ms:end-examStart,started_at:new Date(examStart).toISOString(),completed_at:new Date(end).toISOString(),app_version:VER})}
async function finishExam(){let p=Math.round(correct/session.length*100),pass=correct>=45;$("resultTitle").textContent="ผลการทำแบบทดสอบ";$("score").textContent=`${correct}/${session.length}`;$("score").className="score "+(pass?"pass":"fail");$("judge").textContent=pass?"🎉 ผ่านเกณฑ์ 90%":"📚 ยังไม่ถึง 90%";let map=Object.fromEntries(Q.map(q=>[q.id,q])),w=answers.filter(a=>!a.ok);$("wrongReview").classList.remove("hidden");$("wrongReviewList").innerHTML=w.length?w.map(a=>{let q=map[a.id];return `<div class="reviewCard"><b>❌ ชุด ${q.set} ข้อ ${q.no}</b><br>${q.th}<br>คุณตอบ: ${a.given?"○":"×"} / ถูก: ${q.ans?"○":"×"}<br>⏱ ${(a.ms/1000).toFixed(1)} วินาที<div class="why"><b>เหตุผล</b><br>${q.exp}</div></div>`}).join(""):"🎉 ไม่มีข้อผิด";let sent=await saveSession();$("syncMsg").textContent=sent?"☁️ DB saved":"☁️ queued";saveHist();only("result");flush()}
async function finishReview(){$("resultTitle").textContent="ผลการทบทวน 🐘";$("score").textContent=`${correct}/${session.length}`;$("score").className="score "+(correct/session.length>=.9?"pass":"fail");$("judge").textContent="ตอบทีละข้อพร้อมเฉลยทันทีแล้ว";$("wrongReview").classList.add("hidden");let sent=await saveSession();$("syncMsg").textContent=sent?"☁️ DB saved":"☁️ queued";saveHist();only("result");flush()}
function saveHist(){let h=[];try{h=JSON.parse(localStorage.getItem(LS.hist)||"[]")}catch(e){};h.unshift({d:new Date().toLocaleString("th-TH"),c:correct,t:session.length,m:mode});localStorage.setItem(LS.hist,JSON.stringify(h.slice(0,50)))}
async function showWrongList(){let s=await reviewStats(),map=Object.fromEntries(Q.map(q=>[q.id,q]));s=s.filter(x=>map[x.id]).sort((a,b)=>b.count-a.count);$("wrongList").innerHTML=s.length?s.map((x,i)=>{let q=map[x.id];return `<div class="reviewCard"><b>#${i+1} • ผิด ${x.count} ครั้ง • ชุด ${q.set} ข้อ ${q.no}</b><br>${q.th}<div class="why">${q.exp}</div></div>`}).join(""):"ยังไม่มีข้อผิด";only("list")}
function showHistory(){let h=[];try{h=JSON.parse(localStorage.getItem(LS.hist)||"[]")}catch(e){};$("historyList").innerHTML=h.length?h.map(x=>`<p><b>${x.c}/${x.t}</b> • ${x.m==="review"?"🐘 review":"exam"}<br><span class="small">${x.d}</span></p>`).join(""):"ยังไม่มีประวัติ";only("history")}
function goHome(){only("home");loadSettings();flush()}
window.addEventListener("load",()=>{loadSettings();flush()});window.addEventListener("online",flush);
</script></body></html>
